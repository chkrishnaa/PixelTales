<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="480" cellpadding="0" cellspacing="0"
                 style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08);">

            <tr>
              <td style="background:linear-gradient(135deg,#0f766e,#06b6d4);padding:28px;text-align:center;">
                <span style="font-size:28px;">🎬</span>
                <h1 style="margin:8px 0 0;color:#fff;font-size:20px;font-weight:800;letter-spacing:-0.5px;">
                  PixelTales
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding:28px 32px;">
                <h2 style="margin:0 0 8px;font-size:18px;color:#111827;">{{ title }}</h2>
                <p style="margin:0 0 18px;color:#6b7280;font-size:14px;line-height:1.6;">
                  {{ message }}
                </p>

                <div style="text-align:center;margin:18px 0 22px;">
                  <p style="margin:0;color:#0f766e;font-weight:700;">If you did not make this change, please contact us immediately at <a href="mailto:{{ supportEmail }}">{{ supportEmail }}</a>.</p>
                </div>

                <p style="margin:0;color:#9ca3af;font-size:12px;text-align:center;">
                  © {{ year }} PixelTales. All rights reserved.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
